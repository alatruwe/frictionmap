[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frictionmap"
version = "0.0.1"
description = "CLI that parses Claude Code session logs and produces an HTML friction heatmap of your codebase."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Adeline Latruwe" }]
dependencies = ["radon>=6.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
"frictionmap" = "frictionmap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frictionmap"]
